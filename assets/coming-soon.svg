<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Coming soon">
  <defs>
    <linearGradient id="cs-spectrum" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%"   stop-color="#5B2BC8"/>
      <stop offset="18%"  stop-color="#1F52C8"/>
      <stop offset="38%"  stop-color="#1BA7BC"/>
      <stop offset="55%"  stop-color="#3FBF6E"/>
      <stop offset="74%"  stop-color="#E9D44B"/>
      <stop offset="88%"  stop-color="#E8823A"/>
      <stop offset="100%" stop-color="#D9453F"/>
    </linearGradient>
    <radialGradient id="cs-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%"   stop-color="#1BA7BC" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#1BA7BC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cs-lattice" width="66" height="66" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="4" cy="4" r="1.6" fill="rgba(255,255,255,.20)"/>
      <path d="M4 4h62M4 4v62" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#061527"/>
  <rect width="1600" height="900" fill="url(#cs-lattice)" opacity=".55"/>
  <rect width="1600" height="900" fill="url(#cs-glow)"/>

  <rect x="700" y="250" width="200" height="6" rx="3" fill="url(#cs-spectrum)"/>

  <text x="800" y="470"
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="150" font-weight="700" letter-spacing="6"
        fill="#F2B33D" text-anchor="middle">COMING SOON</text>

  <text x="800" y="560"
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="400" letter-spacing="10"
        fill="#8FA9C8" text-anchor="middle">EMSL INTERNATIONAL RESEARCH INTERNSHIP</text>

  <path d="M480 700 C560 698 610 690 660 660 C700 636 715 560 760 560 C805 560 822 634 862 660
           C912 692 962 700 1120 700"
        fill="none" stroke="#1BA7BC" stroke-width="4" stroke-linecap="round" opacity=".85"/>
</svg>
